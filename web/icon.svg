<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Text lines representing writing -->
  <rect x="106" y="120" width="300" height="16" rx="8" fill="#2a2a4a"/>
  <rect x="106" y="156" width="250" height="16" rx="8" fill="#2a2a4a"/>
  <rect x="106" y="192" width="280" height="16" rx="8" fill="#2a2a4a"/>
  <rect x="106" y="228" width="200" height="16" rx="8" fill="#2a2a4a"/>
  <!-- Detection highlight -->
  <rect x="106" y="156" width="250" height="16" rx="8" fill="#ff4757" opacity="0.3"/>
  <!-- Magnifying glass -->
  <circle cx="320" cy="320" r="80" fill="none" stroke="url(#penGrad)" stroke-width="20"/>
  <line x1="376" y1="376" x2="440" y2="440" stroke="url(#penGrad)" stroke-width="28" stroke-linecap="round"/>
  <!-- AI text inside magnifier -->
  <text x="320" y="320" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-weight="700" font-size="48" fill="#6c63ff">AI</text>
</svg>
